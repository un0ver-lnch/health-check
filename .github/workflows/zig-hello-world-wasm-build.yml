name: GitHub Actions - WASM Build
run-name: WASM module building
env:
  REGISTRY: ghcr.io
on:
  push:
    branches:
      - trunk
    paths:
      - "zig-hello-wasm/**"
      - ".github/workflows/zig-hello-world-wasm-build.yml"
jobs:
  Build-WASM-Module:
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: korandoru/setup-zig@v1
        with:
          zig-version: 0.13.0 # released versions or master
      - name: Build zig wasm module
        run: cd zig-hello-wasm && zig build-exe main.zig -target wasm32-wasi
      - name: Publish zig wasm module
        uses: actions/upload-artifact@v4
        with:
          name: zig-hello-wasm
          path: zig-hello-wasm/main.wasm
      - name: Publish zig sidecar
        uses: actions/upload-artifact@v4
        with:
          name: zig-hello-wasm-sidecar
          path: zig-hello-wasm/sidecar.json
  Deploy-Artifacts-Elisa:
    needs: Build-WASM-Module
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: zig-hello-wasm
          path: download/
      - name: Upload artifact to Elisa
        run: |
          curl http://elisa-health-service.health-check.svc.cluster.local:3000/upload --request PUT -F 'file=@download/main.wasm' -F 'name=main.wasm'
  Deploy-Artifacts-Sidecar-Elisa:
    needs: Build-WASM-Module
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: zig-bitsearch-health-sidecar
          path: download/
      - name: Upload sidecar to Elisia
        run: |
          curl http://elisa-health-service.health-check.svc.cluster.local:3000/upload --request PUT -F 'file=@download/sidecar.json' -F 'name=main.json'
  Restart-Pods:
    needs: [Deploy-Artifacts-Elisa, Deploy-Artifacts-Sidecar-Elisa]
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          repository: un0ver-lnch/universe
          ref: refs/heads/trunk
          token: ${{ secrets.PAT }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: cd bigbang && bun install
      - name: Adjust deployment
        run: cd bigbang && NODE_TLS_REJECT_UNAUTHORIZED=0 FILER=health-check-agent NAMESPACE=health-check bun run src/rollout-deployment.ts
