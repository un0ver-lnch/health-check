name: GitHub Actions - WASM Build
run-name: WASM module building
env:
  REGISTRY: ghcr.io
on:
  push:
    branches:
      - trunk
    paths:
      - "zig-hello-wasm/**"
      - ".github/workflows/zig-hello-world-wasm-build.yml"
jobs:
  Build-WASM-Module:
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: korandoru/setup-zig@v1
        with:
          zig-version: 0.13.0 # released versions or master
      - name: Build zig wasm module
        run: cd zig-hello-wasm && zig build-exe main.zig -target wasm32-wasi
      - name: Publish zig wasm module
        uses: actions/upload-artifact@v4
        with:
          name: zig-hello-wasm
          path: zig-hello-wasm/main.wasm
  Deploy-Artifacts-Elisa:
    needs: Build-WASM-Module
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: zig-hello-wasm
          path: download/
        run: |
          curl http://elisa-health-service.health-check.svc.cluster.local:3000/upload --request PUT -F 'file=@download/main.wasm' -F 'name=main.wasm'
  Restart-Pods:
    needs: Deploy-Artifacts-Elisa
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Config kubectl
        run: |
          echo "$KUBECONFIG_CI" > kubeconfig
          export KUBECONFIG=$(pwd)/kubeconfig
          kubectl get pods
        env:
          KUBECONFIG_CI: ${{ secrets.KUBECONFIG_CI }}
      - name: Restart pods
        run: |
          kubectl rollout restart deployment health-check-agent -n health-check