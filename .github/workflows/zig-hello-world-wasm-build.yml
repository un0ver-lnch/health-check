name: GitHub Actions - WASM Build
run-name: WASM module building
env:
  REGISTRY: ghcr.io
on:
  push:
    branches:
      - trunk
    paths:
      - "zig-hello-wasm/**"
      - ".github/workflows/zig-hello-world-wasm-build.yml"
jobs:
  Build-WASM-Module:
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: korandoru/setup-zig@v1
        with:
          zig-version: 0.13.0 # released versions or master
      - name: Build zig wasm module
        run: cd zig-hello-wasm && zig build-exe main.zig -target wasm32-wasi
      - name: Publish zig wasm module
        uses: actions/upload-artifact@v4
        with:
          name: zig-hello-wasm
          path: zig-hello-wasm/main.wasm
    Deploy-Artifacts-Elisa:
    needs: Build-SO-Module
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: zig-bitsearch-health
          path: download/
      - name: Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          version: latest
      - name: Upload artifact to Elisia
        run: |
          curl https://elisa.tail0edab.ts.net/upload --request PUT --header 'Content-Type: multipart/form-data' -F 'file=@download/main.wasm' -F 'name=main.wasm'