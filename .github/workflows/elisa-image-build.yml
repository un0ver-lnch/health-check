name: GitHub Actions - Elisa Image Build
run-name: Elisa docker image building
env:
  REGISTRY: ghcr.io
on:
  push:
    branches:
      - trunk
    paths:
      - "elisa/**"
      - ".github/workflows/elisa-image-build.yml"

jobs:
  Build-Agent-DockerImage-Arm:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to the Container registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        env:
          DOCKER_BUILDKIT_SANDBOX_MODE: "disabled"
        with:
          context: "{{defaultContext}}:elisa"
          platforms: linux/arm64/v8
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository }}-elisa:${{ github.run_id }}